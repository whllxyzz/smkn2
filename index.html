<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPMB SMKN 2 Tembilahan 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .hero-gradient { background: radial-gradient(circle at top right, rgba(30, 64, 175, 0.05), transparent), radial-gradient(circle at bottom left, rgba(249, 115, 22, 0.05), transparent); }
        
        /* Slider Styles (KEMBALI KE VERSI STABIL) */
        .slider-container { 
            position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden; 
            border-radius: 2rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); 
            background-color: #f1f5f9; touch-action: pan-y; 
        }
        .slide { 
            position: absolute; inset: 0; opacity: 0; visibility: hidden; 
            transition: opacity 1s ease-in-out, visibility 1s; 
        }
        .slide.active { opacity: 1; visibility: visible; }
        .slide img { width: 100%; height: 100%; object-fit: cover; }
        
        .modal { 
            display: none; position: fixed; z-index: 100; inset: 0; 
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px); 
            align-items: center; justify-content: center; padding: 1rem; 
        }
        .modal.active { display: flex; }
        
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <!-- Navigasi -->
    <nav class="fixed w-full z-[60] glass-nav">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="smk.jpg" alt="Logo" class="w-10 h-10 object-cover rounded-lg" onerror="this.src='https://placehold.co/100x100?text=SMK'">
                <div class="flex flex-col">
                    <span class="text-lg font-black text-blue-900 leading-none">SMKN 2</span>
                    <span class="text-[10px] font-bold text-orange-600 uppercase tracking-tighter">Tembilahan</span>
                </div>
            </div>
            <div class="hidden md:flex items-center gap-8 font-bold text-sm text-slate-600">
                <a href="#beranda" class="hover:text-blue-900">Beranda</a>
                <a href="#jurusan" class="hover:text-blue-900">Jurusan</a>
                <button onclick="toggleModal('login-modal')" class="text-blue-900 border border-blue-900 px-4 py-2 rounded-full hover:bg-blue-50 transition-all font-bold">Admin</button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section id="beranda" class="pt-44 pb-20 px-6 md:px-12 hero-gradient">
        <div class="max-w-7xl mx-auto grid lg:grid-cols-2 gap-12 items-center">
            <div class="fade-in">
                <h1 class="text-5xl md:text-6xl font-black text-blue-950 leading-tight mb-6">Masa Depan <br><span class="text-blue-600">Gemilang</span> <br> Menanti Anda.</h1>
                <div id="status-pendaftaran">
                    <button onclick="checkPendaftaran()" class="bg-blue-800 text-white px-8 py-4 rounded-2xl font-bold hover:bg-blue-900 transition-all shadow-xl shadow-blue-200">Daftar Sekarang</button>
                </div>
            </div>
            
            <!-- Slider (VERSI STABIL: MPLS 1-4) -->
            <div class="fade-in relative">
                <div class="slider-container" id="hero-slider">
                    <div class="slide active">
                        <img src="mpls1.jpg.jpeg" alt="MPLS 1" onerror="this.src='https://placehold.co/1200x800?text=Cek+File+MPLS1'">
                    </div>
                    <div class="slide">
                        <img src="mpls2.jpg.jpeg" alt="MPLS 2" onerror="this.src='https://placehold.co/1200x800?text=Cek+File+MPLS2'">
                    </div>
                    <div class="slide">
                        <img src="mpls3.jpg.jpeg" alt="MPLS 3" onerror="this.src='https://placehold.co/1200x800?text=Cek+File+MPLS3'">
                    </div>
                    <div class="slide">
                        <img src="mpls4.jpg.jpeg" alt="MPLS 4" onerror="this.src='https://placehold.co/1200x800?text=Cek+File+MPLS4'">
                    </div>
                </div>
                <!-- Dots Nav (BISA DIKLIK) -->
                <div class="absolute -bottom-10 left-1/2 -translate-x-1/2 flex gap-3">
                    <button onclick="goToSlide(0)" class="w-8 h-2 rounded-full bg-blue-900 slider-dot transition-all"></button>
                    <button onclick="goToSlide(1)" class="w-3 h-2 rounded-full bg-slate-300 slider-dot transition-all"></button>
                    <button onclick="goToSlide(2)" class="w-3 h-2 rounded-full bg-slate-300 slider-dot transition-all"></button>
                    <button onclick="goToSlide(3)" class="w-3 h-2 rounded-full bg-slate-300 slider-dot transition-all"></button>
                </div>
            </div>
        </div>
    </section>

    <!-- Modal Pendaftaran (Anti Spam) -->
    <div id="daftar-modal" class="modal">
        <div class="bg-white p-8 rounded-[2rem] w-full max-w-md shadow-2xl">
            <h2 class="text-2xl font-black text-blue-900 mb-2 text-center">Form Pendaftaran</h2>
            <p class="text-xs text-slate-500 mb-6 text-center font-bold uppercase tracking-widest">Kunci: No. WhatsApp & Perangkat</p>
            <div class="space-y-4">
                <input type="text" id="siswa-nama" placeholder="Nama Lengkap" class="w-full p-4 bg-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500">
                <input type="number" id="siswa-wa" placeholder="Nomor WhatsApp" class="w-full p-4 bg-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500">
                <button id="btn-kirim-daftar" onclick="prosesDaftar()" class="w-full bg-blue-900 text-white py-4 rounded-2xl font-black hover:bg-blue-800 transition-all">KIRIM PENDAFTARAN</button>
                <button onclick="toggleModal('daftar-modal')" class="w-full text-slate-400 text-xs font-bold uppercase">Tutup</button>
            </div>
        </div>
    </div>

    <!-- Modal Login Admin -->
    <div id="login-modal" class="modal">
        <div class="bg-white p-8 rounded-[2rem] w-full max-w-sm shadow-2xl text-center">
            <h2 class="text-2xl font-black text-blue-900 mb-2">Admin Panel</h2>
            <p id="login-msg" class="text-xs text-slate-500 mb-6 font-bold uppercase tracking-widest">Keamanan Login Aktif</p>
            <input type="password" id="admin-pass" placeholder="Password Admin" class="w-full p-4 bg-slate-100 border-none rounded-2xl mb-4 text-center outline-none focus:ring-2 focus:ring-blue-500">
            <button id="btn-login" onclick="handleLogin()" class="w-full bg-blue-900 text-white py-4 rounded-2xl font-black hover:bg-blue-800 transition-all">MASUK</button>
            <button onclick="toggleModal('login-modal')" class="mt-4 text-slate-400 text-xs font-bold uppercase block w-full">Kembali</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- ANTI SPAM & LOCK LOGIC ---
        window.checkPendaftaran = function() {
            const savedName = localStorage.getItem('pendaftar_nama');
            if (savedName) {
                alert(`Maaf, perangkat ini sudah terdaftar atas nama: ${savedName}`);
                return;
            }
            toggleModal('daftar-modal');
        }

        window.prosesDaftar = async function() {
            const nama = document.getElementById('siswa-nama').value;
            const wa = document.getElementById('siswa-wa').value;
            const btn = document.getElementById('btn-kirim-daftar');

            if (!nama || !wa) return alert("Harap isi semua data!");
            
            btn.disabled = true;
            btn.innerText = "MENGECEK...";

            try {
                const q = query(collection(db, "pendaftaran"), where("whatsapp", "==", wa));
                const snap = await getDocs(q);

                if (!snap.empty) {
                    alert("Nomor WhatsApp ini sudah terdaftar sebelumnya!");
                    btn.disabled = false;
                    btn.innerText = "KIRIM PENDAFTARAN";
                    return;
                }

                await addDoc(collection(db, "pendaftaran"), {
                    nama: nama,
                    whatsapp: wa,
                    tanggal: new Date().toISOString()
                });

                localStorage.setItem('pendaftar_nama', nama);
                alert("Pendaftaran Berhasil Terkirim!");
                location.reload(); 
            } catch (e) {
                alert("Gagal mengirim data.");
                btn.disabled = false;
            }
        }
    </script>

    <script>
        // --- SLIDER LOGIC (VERSI STABIL & SWIPE) ---
        let currentSlide = 0;
        let slideInterval;
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.slider-dot');
        const container = document.getElementById('hero-slider');

        function updateSlider() {
            slides.forEach((s, i) => {
                s.classList.toggle('active', i === currentSlide);
                if(dots[i]) {
                    dots[i].className = i === currentSlide 
                        ? 'w-8 h-2 rounded-full bg-blue-900 slider-dot transition-all' 
                        : 'w-3 h-2 rounded-full bg-slate-300 slider-dot transition-all';
                }
            });
        }

        function nextSlide() { currentSlide = (currentSlide + 1) % slides.length; updateSlider(); }
        function goToSlide(n) { currentSlide = n; updateSlider(); resetTimer(); }
        function startTimer() { slideInterval = setInterval(nextSlide, 5000); }
        function resetTimer() { clearInterval(slideInterval); startTimer(); }

        // Swipe Support
        let touchStartX = 0;
        container.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        container.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchEndX < touchStartX - 50) { nextSlide(); resetTimer(); }
            if (touchEndX > touchStartX + 50) { currentSlide = (currentSlide - 1 + slides.length) % slides.length; updateSlider(); resetTimer(); }
        });

        // --- LOGIN ADMIN LOGIC (TETAP) ---
        let attempt = 0;
        window.handleLogin = function() {
            const pass = document.getElementById('admin-pass').value;
            const msg = document.getElementById('login-msg');
            const btn = document.getElementById('btn-login');

            if (pass === "admin123") {
                alert("Login Sukses! Membuka Dashboard...");
            } else {
                attempt++;
                if (attempt >= 3) {
                    btn.disabled = true;
                    let sec = 60;
                    const t = setInterval(() => {
                        sec--;
                        msg.innerText = `TUNGGU ${sec} DETIK`;
                        if(sec <= 0) { clearInterval(t); btn.disabled = false; attempt = 0; msg.innerText = "KEAMANAN LOGIN AKTIF"; }
                    }, 1000);
                } else {
                    alert(`Password Salah! Sisa percobaan: ${3 - attempt}`);
                }
            }
        }

        function toggleModal(id) { document.getElementById(id).classList.toggle('active'); }
        
        window.onload = () => {
            startTimer();
            if(localStorage.getItem('pendaftar_nama')) {
                document.getElementById('status-pendaftaran').innerHTML = `
                    <div class="bg-blue-50 text-blue-800 p-4 rounded-2xl font-bold border border-blue-200">
                        ✅ Terdaftar: ${localStorage.getItem('pendaftar_nama')}
                    </div>`;
            }
        };
    </script>
</body>
</html>
