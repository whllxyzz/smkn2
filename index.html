<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPMB SMKN 2 Tembilahan 2026 - Ultra Mobile Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        
        /* Slider Stability */
        .slider-container { position: relative; width: 100%; height: 300px; overflow: hidden; border-radius: 1.5rem; background: #cbd5e1; }
        @media (min-width: 768px) { .slider-container { height: 480px; border-radius: 2.5rem; } }
        
        .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.8s ease-in-out; }
        .slide.active { opacity: 1; }
        .slide img { width: 100%; height: 100%; object-fit: cover; }
        
        .marquee { white-space: nowrap; overflow: hidden; background: #f97316; color: white; padding: 6px 0; font-size: 12px; font-weight: 800; position: fixed; top: 0; width: 100%; z-index: 100; }
        .marquee p { display: inline-block; padding-left: 100%; animation: marquee 25s linear infinite; }
        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

        .modal { display: none; position: fixed; z-index: 150; inset: 0; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px); align-items: center; justify-content: center; padding: 1rem; }
        .modal.active { display: flex; }
        
        /* Skeleton loading effect */
        .loading-shimmer { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <div class="marquee"><p>PENDAFTARAN SISWA BARU SMKN 2 TEMBILAHAN TAHUN PELAJARAN 2026/2027 TELAH DIBUKA — DAFTAR SEGERA!</p></div>

    <nav class="fixed w-full z-[90] glass-nav mt-7">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <img src="https://i.postimg.cc/65W9msBS/smk.jpg" 
                     onerror="this.src='https://ui-avatars.com/api/?name=SMK2&background=1e40af&color=fff'" 
                     alt="Logo" class="w-10 h-10 object-cover rounded-lg">
                <span class="text-lg font-black text-blue-950 uppercase tracking-tighter">SMKN 2 <span class="text-orange-500">Tembilahan</span></span>
            </div>
            <button onclick="document.getElementById('daftar-modal').classList.add('active')" class="bg-blue-800 text-white px-5 py-2 rounded-xl text-xs font-bold shadow-lg">DAFTAR</button>
        </div>
    </nav>

    <section class="pt-36 pb-16 px-4">
        <div class="max-w-7xl mx-auto grid lg:grid-cols-2 gap-10 items-center">
            <div class="text-center lg:text-left">
                <h1 class="text-4xl md:text-6xl font-black text-blue-950 leading-none mb-6">Mulai Karirmu <br><span class="text-blue-600">Disini.</span></h1>
                <p class="text-slate-500 mb-8 italic">"Bergabunglah dengan sekolah vokasi terbaik untuk masa depan gemilang."</p>
                <div class="flex flex-col sm:flex-row gap-3 justify-center lg:justify-start">
                    <button onclick="document.getElementById('daftar-modal').classList.add('active')" class="bg-blue-800 text-white px-8 py-4 rounded-2xl font-bold">Daftar Sekarang</button>
                    <button onclick="document.getElementById('ai-modal').classList.add('active')" class="bg-white border text-slate-700 px-8 py-4 rounded-2xl font-bold">✨ Konsultasi AI</button>
                </div>
            </div>

            <!-- SLIDER DENGAN SISTEM ANTI-BLOKIR -->
            <div class="relative">
                <div class="slider-container shadow-2xl border-4 border-white">
                    <!-- Slide 1 -->
                    <div class="slide active">
                        <img id="img-hero-1" 
                             src="https://i.postimg.cc/gk9PCn8T/Whats-App-Image-2026-04-28-at-20-28-43.jpg" 
                             data-fallback="https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=800&q=80"
                             alt="Slide 1">
                    </div>
                    <!-- Slide 2 -->
                    <div class="slide">
                        <img id="img-hero-2" 
                             src="https://i.postimg.cc/T37NX4Br/Whats-App-Image-2026-04-28-at-20-28-40.jpg" 
                             data-fallback="https://images.unsplash.com/photo-1541339907198-e08756ebafe3?auto=format&fit=crop&w=800&q=80"
                             alt="Slide 2">
                    </div>
                </div>
                <div class="flex justify-center gap-2 mt-4">
                    <div class="dot w-8 h-2 rounded-full bg-blue-800 transition-all"></div>
                    <div class="dot w-2 h-2 rounded-full bg-slate-300 transition-all"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- MODAL PENDAFTARAN -->
    <div id="daftar-modal" class="modal">
        <div class="bg-white rounded-[2rem] p-8 w-full max-w-md shadow-2xl">
            <h2 class="text-2xl font-black text-blue-900 mb-6 uppercase">Pendaftaran</h2>
            <div class="space-y-4">
                <input type="text" placeholder="Nama Lengkap" class="w-full p-4 bg-slate-50 border rounded-xl outline-none">
                <input type="tel" placeholder="WhatsApp" class="w-full p-4 bg-slate-50 border rounded-xl outline-none">
                <button class="w-full bg-blue-800 text-white py-4 rounded-xl font-bold">Kirim Sekarang</button>
                <button onclick="document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'))" class="w-full text-slate-400 font-bold py-2 text-xs uppercase">Batal</button>
            </div>
        </div>
    </div>

    <!-- MODAL AI -->
    <div id="ai-modal" class="modal">
        <div class="bg-white rounded-[2rem] p-6 w-full max-w-lg shadow-2xl">
            <h2 class="text-xl font-black mb-4">AI Konselor</h2>
            <div class="h-64 overflow-y-auto bg-slate-50 rounded-xl p-4 mb-4 text-sm" id="chat-history">
                <p>Halo! Ingin tahu jurusan yang cocok? Tanya saya!</p>
            </div>
            <div class="flex gap-2">
                <input type="text" id="ai-input" placeholder="Tanya..." class="flex-1 p-3 border rounded-xl outline-none">
                <button onclick="askAI()" class="bg-blue-800 text-white px-4 rounded-xl font-bold">Kirim</button>
            </div>
        </div>
    </div>

    <script>
        // 1. SISTEM PENANGANAN GAMBAR (PENTING)
        function initImageFix() {
            const allImages = document.querySelectorAll('img');
            
            allImages.forEach(img => {
                // Timer Deteksi Gagal (2 detik)
                let loadTimer = setTimeout(() => {
                    if (!img.complete || img.naturalWidth === 0) {
                        triggerFallback(img);
                    }
                }, 2000);

                // Error Langsung
                img.onerror = () => {
                    clearTimeout(loadTimer);
                    triggerFallback(img);
                };

                img.onload = () => {
                    clearTimeout(loadTimer);
                    img.style.opacity = "1";
                };
            });
        }

        function triggerFallback(img) {
            const fallbackUrl = img.getAttribute('data-fallback');
            if (fallbackUrl && img.src !== fallbackUrl) {
                console.warn("Gambar terblokir ISP, beralih ke cadangan Unsplash...");
                img.src = fallbackUrl;
            } else if (!fallbackUrl) {
                img.src = "https://ui-avatars.com/api/?name=SMKN2&background=1e40af&color=fff&size=512";
            }
        }

        // 2. SLIDER LOGIC
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.dot');

        function moveSlide() {
            slides[currentSlide].classList.remove('active');
            dots[currentSlide].className = "dot w-2 h-2 rounded-full bg-slate-300 transition-all";
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
            dots[currentSlide].className = "dot w-8 h-2 rounded-full bg-blue-800 transition-all";
        }
        setInterval(moveSlide, 5000);

        // Run on load
        window.onload = initImageFix;
    </script>
</body>
</html>
