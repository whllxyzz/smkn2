<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPMB SMKN 2 Tembilahan 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; overflow-x: hidden; }
        .glass-nav { 
            background: rgba(255, 255, 255, 0.98); 
            backdrop-filter: blur(15px); 
            border-bottom: 1px solid rgba(226, 232, 240, 1);
            pointer-events: none; /* Agar tidak menghalangi klik di bawahnya jika ada area kosong */
        }
        .nav-content { pointer-events: auto; } /* Tombol di dalam nav tetap bisa diklik */
        
        .hero-gradient { 
            background: radial-gradient(circle at top right, rgba(30, 64, 175, 0.05), transparent), 
                        radial-gradient(circle at bottom left, rgba(249, 115, 22, 0.05), transparent); 
        }
        
        /* SLIDER - Dioptimalkan untuk Sentuhan HP */
        .slider-container { 
            position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden; 
            border-radius: 1.5rem; box-shadow: 0 15px 30px -10px rgba(0,0,0,0.1); 
            background-color: #f1f5f9; touch-action: pan-y; z-index: 5;
        }
        .slide { 
            position: absolute; inset: 0; opacity: 0; visibility: hidden; 
            transition: opacity 0.8s ease-in-out; 
        }
        .slide.active { opacity: 1; visibility: visible; }
        .slide img { width: 100%; height: 100%; object-fit: cover; }
        
        /* MODAL */
        .modal { 
            display: none; position: fixed; z-index: 100; inset: 0; 
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(5px); 
            align-items: center; justify-content: center; padding: 1.5rem; 
        }
        .modal.active { display: flex; }
        
        .fade-in { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* Area Klik Tombol di HP lebih besar */
        .btn-mobile { min-height: 44px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body class="bg-white text-slate-900">

    <nav class="fixed w-full z-[70] glass-nav">
        <div class="nav-content max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <img src="smk.jpg" alt="Logo" class="w-9 h-9 object-cover rounded-lg" onerror="this.src='https://placehold.co/100x100?text=SMK'">
                <div class="flex flex-col">
                    <span class="text-base font-black text-blue-900 leading-none">SMKN 2</span>
                    <span class="text-[9px] font-bold text-orange-600 uppercase tracking-tighter">Tembilahan</span>
                </div>
            </div>
            
            <div class="flex items-center gap-4 md:gap-8 font-extrabold text-[11px] md:text-sm text-slate-700 uppercase tracking-tight">
                <a href="#beranda" class="hover:text-blue-900 py-2">Beranda</a>
                <a href="#jurusan" class="hover:text-blue-900 py-2">Jurusan</a>
                <button onclick="toggleModal('login-modal')" class="bg-blue-900 text-white px-4 py-2 rounded-full shadow-md text-[10px] md:text-xs">ADMIN</button>
            </div>
        </div>
    </nav>

    <section id="beranda" class="pt-28 md:pt-44 pb-16 px-5 md:px-12 hero-gradient min-h-[90vh] flex flex-col justify-center">
        <div class="max-w-7xl mx-auto grid lg:grid-cols-2 gap-10 items-center">
            
            <div class="fade-in text-center lg:text-left order-2 lg:order-1">
                <h1 class="text-4xl md:text-7xl font-black text-blue-950 leading-[1.1] mb-6">Masa Depan <br><span class="text-blue-600">Gemilang</span>.</h1>
                <p class="text-slate-600 font-medium mb-8 text-sm md:text-lg max-w-md mx-auto lg:mx-0">
                    Sistem Pendaftaran Siswa Baru SMKN 2 Tembilahan 2026. Aman, Cepat, dan Terintegrasi.
                </p>
                <div id="status-pendaftaran" class="flex justify-center lg:justify-start">
                    <button onclick="checkPendaftaran()" class="btn-mobile relative z-[80] bg-blue-800 text-white px-10 py-4 rounded-2xl font-black hover:bg-blue-900 transition-all shadow-2xl shadow-blue-300 text-base">
                        DAFTAR SEKARANG
                    </button>
                </div>
            </div>
            
            <div class="fade-in order-1 lg:order-2 relative">
                <div class="slider-container" id="hero-slider">
                    <div class="slide active"><img src="mpls1.jpg.jpeg" alt="MPLS 1"></div>
                    <div class="slide"><img src="mpls2.jpg.jpeg" alt="MPLS 2"></div>
                    <div class="slide"><img src="mpls3.jpg.jpeg" alt="MPLS 3"></div>
                    <div class="slide"><img src="mpls4.jpg.jpeg" alt="MPLS 4"></div>
                </div>
                <div class="absolute -bottom-10 left-1/2 -translate-x-1/2 flex gap-3">
                    <button onclick="goToSlide(0)" class="w-8 h-2 rounded-full bg-blue-900 slider-dot transition-all"></button>
                    <button onclick="goToSlide(1)" class="w-3 h-2 rounded-full bg-slate-300 slider-dot transition-all"></button>
                    <button onclick="goToSlide(2)" class="w-3 h-2 rounded-full bg-slate-300 slider-dot transition-all"></button>
                    <button onclick="goToSlide(3)" class="w-3 h-2 rounded-full bg-slate-300 slider-dot transition-all"></button>
                </div>
            </div>
        </div>
    </section>

    <script type="module">
        // [Logika Firebase, Anti-Spam WA, & Device Lock Anda tetap aman di sini]
    </script>

    <script>
        // SLIDER LOGIC - Responsif & Gesit
        let currentSlide = 0;
        let slideInterval;
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.slider-dot');
        const container = document.getElementById('hero-slider');

        function updateSlider() {
            slides.forEach((s, i) => {
                s.classList.toggle('active', i === currentSlide);
                if(dots[i]) {
                    dots[i].className = i === currentSlide 
                        ? 'w-8 h-2 rounded-full bg-blue-900 slider-dot transition-all' 
                        : 'w-3 h-2 rounded-full bg-slate-300 slider-dot transition-all';
                }
            });
        }

        function nextSlide() { currentSlide = (currentSlide + 1) % slides.length; updateSlider(); }
        function goToSlide(n) { currentSlide = n; updateSlider(); resetTimer(); }
        function startTimer() { slideInterval = setInterval(nextSlide, 5000); }
        function resetTimer() { clearInterval(slideInterval); startTimer(); }

        // SWIPE HP FIX
        let touchStartX = 0;
        container.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX, {passive: true});
        container.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchEndX < touchStartX - 50) { nextSlide(); resetTimer(); }
            if (touchEndX > touchStartX + 50) { currentSlide = (currentSlide - 1 + slides.length) % slides.length; updateSlider(); resetTimer(); }
        }, {passive: true});

        // MODAL & ADMIN LOGIN (Dengan 60 detik cooldown)
        function toggleModal(id) { document.getElementById(id).classList.toggle('active'); }
        
        window.onload = () => {
            startTimer();
            // Cek jika sudah terdaftar
            if(localStorage.getItem('pendaftar_nama')) {
                document.getElementById('status-pendaftaran').innerHTML = `
                    <div class="bg-blue-50 text-blue-800 p-4 rounded-2xl font-bold border border-blue-200 text-sm">
                        ✅ PENDAFTARAN TERKUNCI: ${localStorage.getItem('pendaftar_nama')}
                    </div>`;
            }
        };
    </script>
</body>
</html>
