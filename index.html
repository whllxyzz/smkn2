<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPMB SMKN 2 Tembilahan 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .hero-gradient { background: radial-gradient(circle at top right, rgba(30, 64, 175, 0.05), transparent), radial-gradient(circle at bottom left, rgba(249, 115, 22, 0.05), transparent); }
        
        /* Slider Styles (TETAP) */
        .slider-container { position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden; border-radius: 2rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); background-color: #f1f5f9; touch-action: pan-y; }
        .slide { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity 1s ease-in-out, visibility 1s; }
        .slide.active { opacity: 1; visibility: visible; }
        .slide img { width: 100%; height: 100%; object-fit: cover; }
        
        .modal { display: none; position: fixed; z-index: 100; inset: 0; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 1rem; }
        .modal.active { display: flex; }
        
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <nav class="fixed w-full z-[60] glass-nav">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="smk.jpg" alt="Logo" class="w-10 h-10 object-cover rounded-lg" onerror="this.src='https://placehold.co/100x100?text=SMK'">
                <div class="flex flex-col">
                    <span class="text-lg font-black text-blue-900 leading-none">SMKN 2</span>
                    <span class="text-[10px] font-bold text-orange-600 uppercase tracking-tighter">Tembilahan</span>
                </div>
            </div>
            <div class="hidden md:flex items-center gap-8 font-bold text-sm text-slate-600">
                <a href="#beranda">Beranda</a>
                <a href="#jurusan">Jurusan</a>
                <button onclick="toggleModal('login-modal')" class="text-blue-900 border border-blue-900 px-4 py-2 rounded-full hover:bg-blue-50 transition-all">Admin</button>
            </div>
        </div>
    </nav>

    <section id="beranda" class="pt-44 pb-20 px-6 md:px-12 hero-gradient">
        <div class="max-w-7xl mx-auto grid lg:grid-cols-2 gap-12 items-center">
            <div class="fade-in">
                <h1 class="text-5xl md:text-6xl font-black text-blue-950 leading-tight mb-6">Masa Depan <br><span class="text-blue-600">Gemilang</span>.</h1>
                <div id="status-pendaftaran">
                    <button onclick="checkPendaftaran()" class="bg-blue-800 text-white px-8 py-4 rounded-2xl font-bold hover:bg-blue-900 transition-all shadow-xl shadow-blue-200">Daftar Sekarang</button>
                </div>
            </div>
            
            <div class="fade-in relative">
                <div class="slider-container" id="hero-slider">
                    <div class="slide active"><img src="mpls1.jpg.jpeg"></div>
                    <div class="slide"><img src="mpls2.jpg.jpeg"></div>
                    <div class="slide"><img src="mpls3.jpg.jpeg"></div>
                    <div class="slide"><img src="mpls4.jpg.jpeg"></div>
                </div>
            </div>
        </div>
    </section>

    <div id="daftar-modal" class="modal">
        <div class="bg-white p-8 rounded-[2rem] w-full max-w-md shadow-2xl">
            <h2 class="text-2xl font-black text-blue-900 mb-2 text-center">Form Pendaftaran</h2>
            <p class="text-xs text-slate-500 mb-6 text-center font-bold">SATU PERANGKAT HANYA BISA DAFTAR SEKALI</p>
            
            <div class="space-y-4">
                <input type="text" id="siswa-nama" placeholder="Nama Lengkap" class="w-full p-4 bg-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500">
                <input type="number" id="siswa-wa" placeholder="Nomor WhatsApp (Kunci)" class="w-full p-4 bg-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500">
                <button id="btn-kirim-daftar" onclick="prosesDaftar()" class="w-full bg-blue-900 text-white py-4 rounded-2xl font-black hover:bg-blue-800 transition-all">KIRIM DATA</button>
                <button onclick="toggleModal('daftar-modal')" class="w-full text-slate-400 text-xs font-bold uppercase">Batal</button>
            </div>
        </div>
    </div>

    <div id="login-modal" class="modal">
        <div class="bg-white p-8 rounded-[2rem] w-full max-w-sm shadow-2xl text-center">
            <h2 class="text-2xl font-black text-blue-900 mb-2">Admin Login</h2>
            <p id="login-msg" class="text-xs text-slate-500 mb-6 font-bold">MASUKKAN PASSWORD</p>
            <input type="password" id="admin-pass" placeholder="••••••••" class="w-full p-4 bg-slate-100 border-none rounded-2xl mb-4 text-center outline-none focus:ring-2 focus:ring-blue-500">
            <button id="btn-login" onclick="handleLogin()" class="w-full bg-blue-900 text-white py-4 rounded-2xl font-black hover:bg-blue-800 transition-all">MASUK</button>
        </div>
    </div>

    <script type="module">
        // Import Firebase (Logika Database di sini)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- ANTI SPAM LOGIC ---
        window.checkPendaftaran = function() {
            // 1. Cek Device Lock (LocalStorage)
            if (localStorage.getItem('smkn2_pendaftar_nama')) {
                alert(`Anda sudah terdaftar sebagai ${localStorage.getItem('smkn2_pendaftar_nama')}. Perangkat ini terkunci.`);
                updateTampilanSudahDaftar();
                return;
            }
            toggleModal('daftar-modal');
        }

        window.prosesDaftar = async function() {
            const nama = document.getElementById('siswa-nama').value;
            const wa = document.getElementById('siswa-wa').value;
            const btn = document.getElementById('btn-kirim-daftar');

            if (!nama || !wa) return alert("Isi semua data!");

            btn.disabled = true;
            btn.innerText = "MENGECEK DATABASE...";

            try {
                // 2. Cek WhatsApp Lock (Database Query)
                const q = query(collection(db, "pendaftaran"), where("whatsapp", "==", wa));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    alert("MAAF, NOMOR WHATSAPP INI SUDAH TERDAFTAR!");
                    btn.disabled = false;
                    btn.innerText = "KIRIM DATA";
                } else {
                    // 3. Simpan ke Database
                    await addDoc(collection(db, "pendaftaran"), {
                        nama: nama,
                        whatsapp: wa,
                        timestamp: new Date()
                    });

                    // 4. Kunci di HP User
                    localStorage.setItem('smkn2_pendaftar_nama', nama);
                    alert("PENDAFTARAN BERHASIL!");
                    toggleModal('daftar-modal');
                    updateTampilanSudahDaftar();
                }
            } catch (e) {
                console.error(e);
                alert("Terjadi kesalahan sistem.");
                btn.disabled = false;
            }
        }

        function updateTampilanSudahDaftar() {
            const container = document.getElementById('status-pendaftaran');
            container.innerHTML = `<div class="bg-green-100 text-green-700 p-4 rounded-2xl font-bold border border-green-200">
                ✅ Anda sudah terdaftar: ${localStorage.getItem('smkn2_pendaftar_nama')}
            </div>`;
        }

        // Jalankan cek saat page load
        if (localStorage.getItem('smkn2_pendaftar_nama')) updateTampilanSudahDaftar();
    </script>

    <script>
        // --- SLIDER & MODAL GLOBAL ---
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        function updateSlider() {
            slides.forEach((s, i) => s.classList.toggle('active', i === currentSlide));
            currentSlide = (currentSlide + 1) % slides.length;
        }
        setInterval(updateSlider, 5000);

        function toggleModal(id) { document.getElementById(id).classList.toggle('active'); }

        // --- LOGIN ADMIN (TETAP) ---
        let attempt = 0;
        window.handleLogin = function() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === "admin123") {
                alert("Dashboard Admin Terbuka");
            } else {
                attempt++;
                if (attempt >= 3) {
                    document.getElementById('btn-login').disabled = true;
                    alert("Tunggu 60 detik!");
                    setTimeout(() => { attempt = 0; document.getElementById('btn-login').disabled = false; }, 60000);
                }
            }
        }
    </script>
</body>
</html>
