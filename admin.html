<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Control - WahyuMC</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #121212; color: white; padding: 20px; display: flex; justify-content: center; }
        .panel { background: #1e1e1e; padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #3ecf8e; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-size: 14px; color: #bbb; }
        
        /* Ini biar kotak inputnya muncul dan kelihatan */
        input[type="text"], textarea { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            border-radius: 10px; 
            border: 1px solid #444; 
            background: #2a2a2a; 
            color: white; 
            box-sizing: border-box; 
            display: block;
        }

        .sw-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #2a2a2a; 
            padding: 15px; 
            border-radius: 10px; 
            margin: 20px 0; 
        }

        /* Ini tombol utamanya */
        .btn-update { 
            width: 100%; 
            padding: 15px; 
            background: #3ecf8e; 
            color: #121212; 
            border: none; 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 16px; 
            margin-top: 10px;
        }
        .btn-update:active { transform: scale(0.98); }
        #status-msg { text-align: center; color: #3ecf8e; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="panel">
        <h2>🎮 WahyuMC Remote</h2>
        
        <label>Teks Jalan (Running Text):</label>
        <input type="text" id="runInput" placeholder="Ketik info untuk baris jalan...">
        
        <label>Pesan Pop-Up (Muncul di tengah):</label>
        <textarea id="popInput" rows="4" placeholder="Ketik pesan pengumuman..."></textarea>

        <div class="sw-row">
            <span>Aktifkan Pop-Up?</span>
            <input type="checkbox" id="popCheck" style="width: 25px; height: 25px;">
        </div>

        <button class="btn-update" onclick="kirimData()">TERBITKAN KE WEBSITE</button>
        <p id="status-msg"></p>
    </div>

    <script>
        // PENTING: Ganti dengan data kamu sendiri
        const SUPA_URL = 'https://nrgiawgyqhxqjrqqzsei.supabase.co';
        const SUPA_KEY = 'MASUKKAN_ANON_KEY_PANJANG_KAMU_DISINI'; 
        
        const supabase = window.supabase.createClient(SUPA_URL, SUPA_KEY);

        async function kirimData() {
            const statusLabel = document.getElementById('status-msg');
            statusLabel.innerText = "⏳ Sedang memproses...";

            const { error } = await supabase
                .from('kontrol_admin')
                .update({ 
                    pesan_popup: document.getElementById('popInput').value,
                    running_text: document.getElementById('runInput').value,
                    status_popup: document.getElementById('popCheck').checked
                })
                .eq('id', 1);

            if (!error) {
                statusLabel.innerText = "✅ BERHASIL DIUPDATE!";
                setTimeout(() => { statusLabel.innerText = ""; }, 3000);
            } else {
                alert("Gagal: " + error.message);
                statusLabel.innerText = "❌ Gagal mengupdate.";
            }
        }
    </script>
</body>
</html>
